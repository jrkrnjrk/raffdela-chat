[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
environment=HOME="/root"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --dir /data/redis --appendonly yes --save 60 1 --protected-mode no
autostart=false
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log

[program:mongo]
command=mongod --bind_ip 127.0.0.1 --port 27017 --dbpath /data/db --logpath /data/log/mongod.log --logappend
autostart=false
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/mongo.log
stderr_logfile=/var/log/supervisor/mongo.err.log

[program:rabbit]
command=rabbitmq-server
autostart=false
autorestart=true
priority=10
environment=RABBITMQ_NODENAME="rabbit@localhost",RABBITMQ_MNESIA_BASE="/data/rabbit/mnesia",RABBITMQ_LOG_BASE="/data/log",RABBITMQ_DEFAULT_USER="rabbituser",RABBITMQ_DEFAULT_PASS="rabbitpass",HOME="/root"
stdout_logfile=/var/log/supervisor/rabbit.log
stderr_logfile=/var/log/supervisor/rabbit.err.log

[program:minio]
command=minio server /data/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
autostart=false
autorestart=true
priority=10
environment=MINIO_ROOT_USER="minioautumn",MINIO_ROOT_PASSWORD="minioautumn",MINIO_DOMAIN="127.0.0.1"
stdout_logfile=/var/log/supervisor/minio.log
stderr_logfile=/var/log/supervisor/minio.err.log

[program:api]
command=/usr/local/bin/run-stoat.sh revolt-delta
directory=/
autostart=false
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err.log

[program:events]
command=/usr/local/bin/run-stoat.sh revolt-bonfire
directory=/
autostart=false
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/events.log
stderr_logfile=/var/log/supervisor/events.err.log

[program:autumn]
command=/usr/local/bin/run-stoat.sh revolt-autumn
directory=/
autostart=false
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/autumn.log
stderr_logfile=/var/log/supervisor/autumn.err.log

[program:january]
command=/usr/local/bin/run-stoat.sh revolt-january
directory=/
autostart=false
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/january.log
stderr_logfile=/var/log/supervisor/january.err.log

[program:gifbox]
command=/usr/local/bin/run-stoat.sh revolt-gifbox
directory=/
autostart=false
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/gifbox.log
stderr_logfile=/var/log/supervisor/gifbox.err.log

[program:crond]
command=/usr/local/bin/run-stoat.sh revolt-crond
directory=/
autostart=false
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/crond.log
stderr_logfile=/var/log/supervisor/crond.err.log

[program:pushd]
command=/usr/local/bin/run-stoat.sh revolt-pushd
directory=/
autostart=false
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/pushd.log
stderr_logfile=/var/log/supervisor/pushd.err.log

[program:web]
command=/usr/local/bin/run-stoat.sh /bin/bash -lc "node inject.js && npx sirv dist_injected --port 5000 --cors --single --host 0.0.0.0"
directory=/opt/stoat-web
autostart=false
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/web.log
stderr_logfile=/var/log/supervisor/web.err.log

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=false
autorestart=true
priority=60
stdout_logfile=/var/log/supervisor/caddy.log
stderr_logfile=/var/log/supervisor/caddy.err.log
